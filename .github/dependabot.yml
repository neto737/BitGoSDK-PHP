version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore(ci)

  # The 2.x maintenance branch. Dependabot only reads this file from the default branch.
  - package-ecosystem: composer
    directory: /
    target-branch: "2.x"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    target-branch: "2.x"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore(ci)
